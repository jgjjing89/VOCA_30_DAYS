<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOCA 마스터 (내장형)</title>
<style>
    body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: #eef2f5; margin: 0; padding: 0; color: #333; }
    
    .app-container { max-width: 950px; margin: 40px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
    .app-container h1 { color: #0f766e; margin-top: 0; text-align: center; border-bottom: 2px solid #eef2f5; padding-bottom: 15px; font-size: 24px; }
    .instruction { font-size: 14px; color: #0f766e; background: #f0fdfa; padding: 12px 15px; border-radius: 6px; margin-bottom: 20px; text-align: center; font-weight: bold; }
    
    .grid-container { display: grid; grid-template-columns: 1fr 1fr 1.5fr; gap: 20px; background: #f8fafc; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    .grid-item { display: flex; flex-direction: column; gap: 10px; }
    .grid-item label.title { font-weight: bold; color: #334155; font-size: 15px; border-bottom: 1px solid #cbd5e1; padding-bottom: 5px; margin-bottom: 5px; }
    
    .inline-inputs { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #333; }
    input[type="number"], select { padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 14px; }
    input[type="number"] { width: 60px; text-align: center; font-weight: bold; }
    
    .checkbox-group { display: flex; flex-direction: column; gap: 8px; font-size: 13.5px; color: #222; }
    .checkbox-group label { cursor: pointer; display: flex; align-items: flex-start; gap: 6px; line-height: 1.3; }
    .checkbox-group input[type="checkbox"] { transform: scale(1.1); margin-top: 2px; cursor: pointer; }
    
    .cnt-badge { color: #0f766e; font-weight: bold; font-size: 12.5px; margin-left: 3px; }
    .help-text { font-size: 11.5px; color: #64748b; margin-top: -3px; }

    button.btn-generate { background: #0f766e; color: white; border: none; padding: 16px 0; width: 100%; font-size: 18px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; letter-spacing: 1px; }
    button.btn-generate:hover { background: #115e59; transform: translateY(-2px); }
    
    .btn-back { display: none; margin: 20px auto; padding: 12px 24px; background: #64748b; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
    .btn-back:hover { background: #475569; }

    /* 인쇄 영역 */
    .print-area { display: none; }
    .page { background: white; width: 210mm; min-height: 297mm; margin: 0 auto; padding: 15mm; box-sizing: border-box; position: relative; }
    .page-break { page-break-after: always; }
    
    .test-header { text-align: center; border-bottom: 3px double #333; margin-bottom: 25px; padding-bottom: 15px; }
    .test-header h1 { margin: 0 0 10px 0; font-size: 26px; }
    .student-info { display: flex; justify-content: flex-end; gap: 20px; font-size: 15px; font-weight: bold; }
    .student-info span { border-bottom: 1px solid #000; width: 100px; text-align: center; display: inline-block; }

    .q-grid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 40px; row-gap: 18px; }
    .q-box { display: flex; flex-direction: column; border-bottom: 1px dashed #cbd5e1; padding-bottom: 8px; }
    .q-main { display: flex; align-items: baseline; gap: 8px; font-size: 15px; }
    .q-num { font-weight: bold; width: 25px; text-align: right; color: #444; }
    .q-text { font-weight: bold; font-size: 16px; word-break: break-word;}
    .q-hint { font-size: 12px; color: #666; font-style: italic; }
    .q-blank-area { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; margin-left: 33px; }
    .q-blank-main { width: 100%; height: 18px; }
    .q-blank-syn { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #555; }
    .syn-line { flex-grow: 1; border-bottom: 1px solid #cbd5e1; height: 15px; }

    .ans-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 15px; }
    .ans-table th, .ans-table td { border: 1px solid #555; padding: 6px; }
    .ans-table th { background: #f8fafc; }
    .cat-badge { font-size: 11px; background: #e2e8f0; padding: 2px 5px; border-radius: 4px; word-break: keep-all; font-weight: bold; color: #0f766e; }

    @media print {
        body { background: white; margin: 0; }
        .app-container, .btn-back { display: none !important; }
        .print-area { display: block !important; }
        .page { width: 100%; min-height: auto; margin: 0; padding: 10mm; box-shadow: none; }
    }
</style>
</head>
<body>

<div class="app-container" id="appScreen">
    <h1>🚀 VOCA 마스터 시험지 생성기</h1>
    <div class="instruction">오류 수정 완료! 각 카테고리가 겹침 없이 완벽하게 독립적으로 출제됩니다.</div>
    
    <div class="grid-container">
        <!-- 1. 공통 설정 -->
        <div class="grid-item">
            <label class="title">⚙️ 공통 설정</label>
            <div class="inline-inputs" style="margin-top: 5px;">
                총 <input type="number" id="qCount" value="40" min="1"> 문항 출제
            </div>
            <select id="testType" style="margin-top: 10px; width: 100%;">
                <option value="EtoK">영어 제시 ➔ 뜻 적기</option>
                <option value="KtoE">뜻 제시 ➔ 영어 적기</option>
            </select>
        </div>

        <!-- 2. 일반 단어 전용 설정 -->
        <div class="grid-item">
            <label class="title">📖 일반 단어 전용 설정</label>
            <div class="help-text">※ 숙어/구동사에는 범위 적용 안됨</div>
            <div class="inline-inputs" style="margin-top: 5px;">
                Day <input type="number" id="startDay" value="1" min="1"> ~ 
                <input type="number" id="endDay" value="30" min="1">
            </div>
            <select id="synOption" style="margin-top: 5px; width: 100%;">
                <option value="none">유의어 출제 안 함</option>
                <option value="hint">문제 옆에 유의어(Syn) 표시</option>
                <option value="blank">유의어도 쓰도록 빈칸 추가</option>
            </select>
        </div>

        <!-- 3. 카테고리 선택 -->
        <div class="grid-item">
            <label class="title">🗂️ 출제 카테고리 (자유 조합)</label>
            <div class="checkbox-group">
                <label><input type="checkbox" value="일반 단어" class="cat-cb" checked> 일반 단어 (Day 설정 적용)</label>
                <label><input type="checkbox" value="중요 숙어" class="cat-cb" checked> 중요 숙어 <span class="cnt-badge" id="cnt-중요숙어"></span></label>
                <label><input type="checkbox" value="Separable Transitive Phrasal Verb" class="cat-cb" checked> Separable Transitive Phrasal Verb <span class="cnt-badge" id="cnt-separabletransitivephrasalverb"></span></label>
                <label><input type="checkbox" value="Unpaired Ergative Phrasal Verb" class="cat-cb" checked> Unpaired Ergative Phrasal Verb <span class="cnt-badge" id="cnt-unpairedergativephrasalverb"></span></label>
                <label><input type="checkbox" value="Paired Ergative Phrasal Verb" class="cat-cb" checked> Paired Ergative Phrasal Verb <span class="cnt-badge" id="cnt-pairedergativephrasalverb"></span></label>
                <label><input type="checkbox" value="Prepositional Verb" class="cat-cb" checked> Prepositional Verb <span class="cnt-badge" id="cnt-prepositionalverb"></span></label>
                <label><input type="checkbox" value="Phrasal Prepositional Verb" class="cat-cb" checked> Phrasal Prepositional Verb <span class="cnt-badge" id="cnt-phrasalprepositionalverb"></span></label>
            </div>
        </div>
    </div>
    
    <button class="btn-generate" onclick="generateTest()">🖨️ 시험지 생성 및 인쇄하기</button>
</div>

<button class="btn-back" id="btnBack" onclick="goBack()">🔙 설정 화면으로 돌아가기</button>
<div id="printArea" class="print-area"></div>

<script>
    // 전역 변수로 단어 맵 저장
    let globalWordMap = new Map();

    function parseLine(text) {
        if (text.includes('\t')) return text.split('\t').map(s => s.trim().replace(/^"|"$/g, ''));
        let arr = [], quote = false, col = '';
        for (let i = 0; i < text.length; i++) {
            let c = text[i];
            if (c === '"') { quote = !quote; continue; }
            if (c === ',' && !quote) { arr.push(col.trim()); col = ''; continue; }
            col += c;
        }
        arr.push(col.trim());
        return arr;
    }

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    // 페이지 로딩 시 데이터를 미리 읽어와서 카테고리별 갯수 파악
    window.onload = function() {
        const rawData = document.getElementById('embeddedData').textContent.trim();
        if(!rawData) return; // 데이터가 아직 안 들어있으면 패스

        const lines = rawData.split('\n');
        globalWordMap.clear();

        for(let i = 0; i < lines.length; i++) {
            let line = lines[i].trim();
            if(!line) continue;
            
            let cols = parseLine(line);
            if(cols.length < 3) continue;

            let col0 = cols[0].replace(/^\uFEFF/, '').trim(); 
            let col1 = cols[1] ? cols[1].trim() : "1";
            let col2 = cols[2] ? cols[2].trim() : "";
            let col3 = cols[3] ? cols[3].trim() : "";

            if(/^\d+$/.test(col0)) {
                let day = parseInt(col0);
                let num = col1;
                let word = col2;
                let val = col3;
                let key = "GEN_" + day + "_" + word.toLowerCase();
                
                if(!globalWordMap.has(key)) {
                    globalWordMap.set(key, { day: day, num: num, word: word, mean: "", syn: "", cat: "일반 단어" });
                }
                
                let obj = globalWordMap.get(key);
                if(/[가-힣]/.test(val)) { obj.mean = obj.mean ? obj.mean + " / " + val : val; } 
                else { obj.syn = obj.syn ? obj.syn + ", " + val : val; }
            } 
            else {
                let cat = col0;
                let day = parseInt(col1) || 1;
                let num = col1;
                let word = col2;
                let mean = col3;
                let syn = cols[4] ? cols[4].trim() : "";
                
                let key = "SP_" + cat + "_" + word.toLowerCase(); 
                if(!globalWordMap.has(key)) {
                    globalWordMap.set(key, { day: day, num: num, word: word, mean: mean, syn: syn, cat: cat.trim() });
                } else {
                    globalWordMap.get(key).mean += " / " + mean;
                }
            }
        }

        // 카테고리별 개수 카운트
        let catCounts = {};
        for (let obj of globalWordMap.values()) {
            let cRaw = obj.cat.replace(/\s+/g, '').toLowerCase();
            catCounts[cRaw] = (catCounts[cRaw] || 0) + 1;
        }

        // 화면 라벨(span) 업데이트
        document.querySelectorAll('.cat-cb').forEach(cb => {
            if(cb.value === "일반 단어") return; // 일반 단어는 제외
            let cRaw = cb.value.replace(/\s+/g, '').toLowerCase();
            let count = catCounts[cRaw] || 0;
            let spanId = "cnt-" + cRaw;
            let spanElement = document.getElementById(spanId);
            if(spanElement && count > 0) {
                spanElement.innerText = `(총 ${count}개)`;
            }
        });
    };

    function generateTest() {
        if(globalWordMap.size === 0) { 
            alert("데이터가 내장되지 않았거나 파싱에 실패했습니다. 데이터를 다시 확인해 주세요."); 
            return; 
        }

        const qCount = parseInt(document.getElementById('qCount').value);
        const testType = document.getElementById('testType').value;
        const startDay = parseInt(document.getElementById('startDay').value);
        const endDay = parseInt(document.getElementById('endDay').value);
        const synOption = document.getElementById('synOption').value;

        // 선택된 카테고리 목록 배열 생성 (비교를 위해 소문자 및 공백제거)
        const selectedCats = Array.from(document.querySelectorAll('.cat-cb:checked'))
                                  .map(cb => cb.value.replace(/\s+/g, '').toLowerCase());

        if(selectedCats.length === 0) { alert("최소 하나 이상의 출제 카테고리를 선택해 주세요."); return; }

        let pool = [];
        for (let obj of globalWordMap.values()) {
            let objCatRaw = obj.cat.replace(/\s+/g, '').toLowerCase();
            
            // includes 방식의 '부분 일치'가 아닌 '정확한 완전 일치'로 검사 (버그 수정 부분!)
            let isMatched = selectedCats.includes(objCatRaw);
            
            if (isMatched) {
                if (obj.cat === "일반 단어") {
                    if (obj.day >= startDay && obj.day <= endDay) {
                        pool.push(obj);
                    }
                } else {
                    pool.push(obj);
                }
            }
        }

        if(pool.length === 0) { alert("해당 조건에 맞는 단어가 부족합니다. 설정을 변경해 보세요."); return; }

        shuffle(pool);
        const selected = pool.slice(0, Math.min(qCount, pool.length));

        const printArea = document.getElementById('printArea');
        let html = '';

        html += `<div class="page page-break">
            <div class="test-header">
                <h1>VOCA 실전 마스터 테스트</h1>
                <div style="font-size:14px; margin-bottom:10px;">총 ${selected.length}문항</div>
                <div class="student-info">이름: <span></span> 점수: <span style="width:70px;"></span> / ${selected.length}</div>
            </div>
            <div class="q-grid">`;

        selected.forEach((q, idx) => {
            let promptText = testType === 'EtoK' ? q.word : q.mean;
            let hintHtml = '';
            let blankHtml = '<div class="q-blank-main"></div>';

            if (q.cat === "일반 단어" && q.syn) {
                if (synOption === 'hint') hintHtml = `<span class="q-hint">(syn: ${q.syn})</span>`;
                else if (synOption === 'blank') blankHtml += `<div class="q-blank-syn">유의어: <div class="syn-line"></div></div>`;
            }

            html += `
                <div class="q-box">
                    <div class="q-main"><span class="q-num">${idx + 1}.</span><span class="q-text">${promptText}</span>${hintHtml}</div>
                    <div class="q-blank-area">${blankHtml}</div>
                </div>`;
        });

        html += `</div></div>`;

        html += `<div class="page">
            <div class="test-header" style="border-bottom:none;"><h1>정답지 및 출제 근거</h1></div>
            <table class="ans-table">
                <thead>
                    <tr>
                        <th style="width: 5%;">No</th>
                        <th style="width: 25%;">분류 (출처)</th>
                        <th style="width: 22%;">단어</th>
                        <th style="width: 30%;">뜻</th>
                        <th style="width: 18%;">유의어</th>
                    </tr>
                </thead>
                <tbody>`;

        selected.forEach((q, idx) => {
            let sourceInfo = q.cat === "일반 단어" ? `<div style="color:#666; font-size:11px; margin-top:3px;">D${q.day}-${q.num}</div>` : "";
            
            html += `
                <tr>
                    <td style="text-align:center;"><b>${idx + 1}</b></td>
                    <td style="text-align:center;"><div class="cat-badge">${q.cat}</div>${sourceInfo}</td>
                    <td><b>${q.word}</b></td>
                    <td>${q.mean}</td>
                    <td style="color:#0f766e; font-size: 11.5px;">${(q.cat === "일반 단어" && q.syn) ? q.syn : '-'}</td>
                </tr>`;
        });

        html += `</tbody></table></div>`;

        document.getElementById('appScreen').style.display = 'none';
        printArea.innerHTML = html;
        printArea.style.display = 'block';
        document.getElementById('btnBack').style.display = 'block';
        
        setTimeout(() => { window.print(); }, 500);
    }

    function goBack() {
        document.getElementById('printArea').style.display = 'none';
        document.getElementById('btnBack').style.display = 'none';
        document.getElementById('appScreen').style.display = 'block';
    }
</script>

</body>
</html>
